# Central (left) half OLED settings

# Enable WPM tracking (only works on central)
CONFIG_ZMK_WPM=y

# Disable signal/output indicator
CONFIG_NICE_OLED_WIDGET_OUTPUT_BACKGROUND=n

# Battery (enabled by default)

# WPM widgets
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH_FIXED_RANGE=y
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH_FIXED_RANGE_MAX=100
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y

# Modifiers with macOS symbols
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL=y
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_FIXED_SYMBOL_MACOS=y

# Layer indicator
CONFIG_NICE_OLED_WIDGET_LAYER=y

# Disable animations on central (Luna/Bongo)
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
