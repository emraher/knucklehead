combos:
  - p: [16, 17]
    k: { t: $$mdi:star-four-points$$ }
    l: [L1, L2, Fn]
  - p: [18, 19]
    k: { t: $$mdi:star-four-points$$ }
    l: [L1, L2, Fn]
  # Additional symbols
  - p: [31, 32]
    k: { t: "|" }
    l: [L1, L2]
  - p: [32, 33]
    k: { t: "_" }
    l: [L1, L2]
  - p: [10, 22]
    k: { t: "`" }
    l: [L1, L2]
  - p: [22, 34]
    k: { t: "~" }
    l: [L1, L2]
  - p: [27, 28]
    k: { t: "{" }
    l: [L1, L2]
  - p: [28, 29]
    k: { t: "}" }
    l: [L1, L2]
  - p: [33, 34]
    k: { t: ":" }
    l: [L1, L2]
  # R language operators
  - p: [31, 33]
    k: { t: "<-" }
    l: [L1, L2]
  - p: [30, 31]
    k: { t: "|>" }
    l: [L1, L2]
  - p: [14, 27]
    k: { t: "```{r}" }
    l: [L1]
  # Layer access combos
  - p: [37, 40]
    k: { t: "Fn" }
    l: [L1]
